# All Cancún — Mantener despierto el proyecto de Supabase
#
# El plan gratis pausa el proyecto tras ~7 días sin actividad en la base.
# Un ping diario evita la pausa y no gasta cuota (60 peticiones/mes contra
# un límite de 2,000 minutos de Actions en repos privados; en públicos es
# ilimitado).
#
# ⚠️ OJO: GitHub desactiva los workflows programados tras 60 días SIN
# commits en el repositorio. Si el repo se queda quieto, el ping deja de
# correr y el proyecto se pausa igual. Si te pasa, vuelve a activarlo
# desde la pestaña Actions (botón "Enable workflow").

name: keepalive

on:
  schedule:
    # 14:00 UTC = 08:00 en Cancún
    - cron: "0 14 * * *"
  workflow_dispatch: # permite lanzarlo a mano para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar una fila
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL}/rest/v1/negocios?select=id&limit=1"
          CODE=$(curl -s -o /tmp/salida.json -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "$URL")

          echo "HTTP $CODE"
          cat /tmp/salida.json

          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase respondió $CODE. ¿Proyecto pausado?"
            exit 1
          fi
          echo "Proyecto activo."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
